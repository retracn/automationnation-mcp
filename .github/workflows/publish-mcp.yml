name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths: ["servers/**", ".github/workflows/publish-mcp.yml"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish every server
        run: |
          # A version that is already in the registry is skipped, not an error: bump "version" in server.json to republish.
          ok=0; skipped=0; failed=0
          for dir in servers/*/; do
            echo "::group::${dir}"
            if out=$(cd "$dir" && "$GITHUB_WORKSPACE/mcp-publisher" publish 2>&1); then
              ok=$((ok+1))
            elif grep -q "cannot publish duplicate version" <<<"$out"; then
              skipped=$((skipped+1))
            else
              failed=$((failed+1)); echo "::error::${dir} not published"
            fi
            echo "$out"
            echo "::endgroup::"
          done
          echo "Published: ${ok}, already up to date: ${skipped}, failed: ${failed}"
          [ "$failed" -eq 0 ]
